<div class="h-full w-full flex gap-4">
    
    <!-- @if (!isLeftSidebarCollapsed()) { -->
    <!-- <div class="flex flex-col w-[10%] justify-center ">
        <div class="flex-1 overflow-y-auto p-4 rounded-lg">
            <div>
            </div>
        </div>
    </div> -->
<!-- } -->
    <div class=" flex flex-col gap-4 w-[90%]  gap-0 sm:me-4  ">
        <!-- dropdown section -->
        <div class="flex justify-between mb-2 ml-[60px] md:ml-0">
            <div class="flex">
                <div class="flex gap-2">
                    <!-- Select States dropdown section -->
                    <div class="relative w-40">
                        <!-- States Dropdown Button -->
                        <button
                            type="button"
                            (click)="toggleProductDropdown()"
                            class="w-full text-left bg-white border border-[#D5D7DA] rounded-[8px] shadow-[0px_1px_2px_rgba(10,13,18,0.05)] py-2 px-4 flex justify-between items-center text-dropdown-text-color text-sm font-medium h-[100%] whitespace-nowrap overflow-hidden truncate w-[18ch]">
                            {{ selectedState}}
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-5 w-5 text-gray-500"
                                viewBox="0 0 20 20"
                                fill="currentColor"
                                >
                                <path
                                    fill-rule="evenodd"
                                    d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                                    clip-rule="evenodd"
                                />
                            </svg>
                        </button>
                        <!-- States Dropdown Menu -->
                        <div
                            *ngIf="isProductDropdownOpen"
                            class="absolute w-full bg-white border border-gray-200 rounded-md shadow-lg z-10">
                            <ul>
                                <li
                                    *ngFor="let product of products;let i = index"  
                                    (click)="selectProduct(product,i)"
                                    id={{i}}
                                    class="text-dropdown-text-color cursor-pointer px-4 py-2 hover:bg-gray-100 text-sm font-medium border-b border-gray-200 last:border-b-0"
                                >
                                    {{ product }}
                                </li>
                            </ul>
                        </div>
                    </div>
                    <!--/* Filter */-->
                    <div class="my-auto bg-white border border-[#D5D7DA] rounded-[8px] px-[16px] py-[10px] flex items-center gap-[8px] shadow-[0px_1px_2px_rgba(10,13,18,0.05)] text-search-text-color text-sm font-medium">
                        <span class="w-[18.33px] h-[18.33px] bg-[url('./app/resources/icons/filter-icon.svg')]">
                        </span>
                    </div>
                </div>
            </div>
            <!-- bell icon -->
            <div class="flex">
                <button class="hidden lg:flex justify-center items-center py-[8px] px-[16px] gap-[8px] border border-[#D5D7DA] rounded-[8px] w-fit h-fit border gradient-border-button" (click)="customizeWidgets()">
                    <svg width="12" height="13" viewBox="0 0 12 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0.666667 7.16667H4.66667C5.03333 7.16667 5.33333 6.86667 5.33333 6.5V1.16667C5.33333 0.8 5.03333 0.5 4.66667 0.5H0.666667C0.3 0.5 0 0.8 0 1.16667V6.5C0 6.86667 0.3 7.16667 0.666667 7.16667ZM0.666667 12.5H4.66667C5.03333 12.5 5.33333 12.2 5.33333 11.8333V9.16667C5.33333 8.8 5.03333 8.5 4.66667 8.5H0.666667C0.3 8.5 0 8.8 0 9.16667V11.8333C0 12.2 0.3 12.5 0.666667 12.5ZM7.33333 12.5H11.3333C11.7 12.5 12 12.2 12 11.8333V6.5C12 6.13333 11.7 5.83333 11.3333 5.83333H7.33333C6.96667 5.83333 6.66667 6.13333 6.66667 6.5V11.8333C6.66667 12.2 6.96667 12.5 7.33333 12.5ZM6.66667 1.16667V3.83333C6.66667 4.2 6.96667 4.5 7.33333 4.5H11.3333C11.7 4.5 12 4.2 12 3.83333V1.16667C12 0.8 11.7 0.5 11.3333 0.5H7.33333C6.96667 0.5 6.66667 0.8 6.66667 1.16667Z" fill="black"/>
                    </svg>
                </button>
                <span class="w-[22.76px] h-[29.25px] scale-[.6] bg-[url('./app/resources/icons/blue-bell-icon.svg')]"></span>
            </div>
        </div>
        <!--/* Welcome and Customize Widgets */-->
        <div class="flex justify-between">
            <div>
                <h2>Welcome {{userName}}!</h2>
            </div>
        </div>
        <!-- summary card section -->
        <div class="grid grid-cols-1 sm:grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- summary card
            <div *ngFor="let upDate of releaseNotesSummary">
                <app-summary-card [data]="upDate"/>
            </div> -->
             <!-- <div
                                    *ngFor="let product of selectedInsitesData;let i = index"  
                                    (click)="selectProduct(product,i)"
                                    id={{i}}
                                    class="text-dropdown-text-color cursor-pointer px-4 py-2 hover:bg-gray-100 text-sm font-medium border-b border-gray-200 last:border-b-0"
                                >
                                    {{ product }}
            </div> -->
            <div>
                <app-insites-card [data]="carddata[selectedIndex][0]" [title]="selectedState"/>
            </div>
            <div>
                <app-insites-card [data]="carddata[selectedIndex][1]" [title]="selectedState"/>
            </div>
            <div>
                <app-insites-card [data]="carddata[selectedIndex][2]" [title]="selectedState"/>
            </div>
        </div>
        <!-- Chart display section -->
        <div class="grid lg:grid-cols-1 gap-4">
            <div  class="bg-white border border-[#D0D1D4] rounded-lg p-4">
                <div class="flex gap-[8px] justify-between"> 
                    <p class="text-base font-bold text-[#22252B] self-center">Customer Needs Predicted</p>
                        <button class="flex gap-[4px] items-end">
                            <div class="w-[19px] h-[20px] bg-[url('./app/resources/icons/orange-stars.svg')]"></div>
                            <p class="text-xs font-medium  flex  text-[#FF6632]">Ask Insites</p>
                        </button> 
                    
                </div>
                <app-stackedarea-chart></app-stackedarea-chart>
            </div>
        </div>
        <div class="grid sm:grid-cols-1 lg:grid-cols-3 gap-4">
            <div class="bg-white border border-[#D0D1D4] rounded-lg p-4" >
                <div class="flex gap-[8px] justify-between"> 
                    <p class="text-base font-bold text-[#22252B] self-center">Ischemic Stroke Mortality</p>                    
                </div>
                <app-doughnut-chart></app-doughnut-chart>
                <div class="flex gap-[8px] justify-between"> 
                        <button class="flex gap-[4px] items-start">
                            <div class="w-[19px] h-[20px] bg-[url('./app/resources/icons/orange-stars.svg')]"></div>
                            <p class="text-xs font-medium  flex  text-[#FF6632]">Ask Insites</p>
                        </button> 
                        <button class="flex gap-[8px] items-end">
                            <div class="w-[16px] h-[16px]  bg-[url('./app/resources/icons/icon_link.svg')] bg-no-repeat self-center"></div>
                            <p class="text-xs font-normal text-[#737780]  self-center">sources</p>
                        </button> 
                    
                </div>
            </div>
            <div class="col-span-2 bg-white border border-[#D0D1D4] rounded-lg p-4">
                <div class="flex gap-[8px] justify-between"> 
                    <p class="text-base font-bold text-[#22252B] self-center">Top 5 States by Primary Dx</p>
                        <button class="flex gap-[4px] items-end">
                            <div class="w-[19px] h-[20px] bg-[url('./app/resources/icons/orange-stars.svg')]"></div>
                            <p class="text-xs font-medium  flex  text-[#FF6632]">Ask Insites</p>
                        </button>                     
                </div>
                <app-bar-chart></app-bar-chart>
            </div>
        </div>
    </div>
    <!-- chat section -->
    <div class="flex flex-col w-[10%] justify-center ">
        <div class="flex-1 overflow-y-auto p-4 rounded-lg">
            <div>
            </div>
        </div>
        <div class="flex items-center justify-end">
            <button class="w-[68px] h-[68px] bg-[url('./app/resources/icons/ask-docubot-button.svg')]">
            </button>
        </div>
    </div>
</div>
